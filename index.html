<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VC+Founders Scorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8">
    <div class="max-w-2xl mx-auto space-y-8">
        <header>
            <h1 class="text-3xl font-bold text-blue-400">Resume Intelligence Engine</h1>
            <p class="text-slate-400">Upload resumes to score them against custom VC criteria.</p>
        </header>

        <form id="uploadForm" class="space-y-6 bg-slate-800 p-6 rounded-xl border border-slate-700">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Anthropic API Key</label>
                    <input type="password" id="anthropicKey" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Google API Key</label>
                    <input type="password" id="googleKey" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Event Focus (e.g., "AI Infrastructure Founders")</label>
                <input type="text" id="prompt" required class="w-full bg-slate-900 border border-slate-600 rounded p-2">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Resumes (PDF, DOCX, TXT)</label>
                <input type="file" id="resumeFiles" multiple accept=".pdf,.docx,.txt" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold transition">
                Generate Rubric & Score
            </button>
        </form>

        <div id="results" class="hidden space-y-4">
            <h2 class="text-xl font-bold">Results</h2>
            <div id="resultsList" class="space-y-2"></div>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Processing (this may take 30-60s)...";

            const formData = new FormData();
            formData.append('anthropic_key', document.getElementById('anthropicKey').value);
            formData.append('google_key', document.getElementById('googleKey').value);
            formData.append('prompt', document.getElementById('prompt').value);
            
            const files = document.getElementById('resumeFiles').files;
            for (let i = 0; i < files.length; i++) {
                formData.append('files', files[i]);
            }

            try {
                const response = await fetch('/api/process', { method: 'POST', body: formData });
                const data = await response.json();
                
                document.getElementById('results').classList.remove('hidden');
                const list = document.getElementById('resultsList');
                list.innerHTML = data.map(res => `
                    <div class="bg-slate-800 p-4 rounded border-l-4 border-blue-500">
                        <div class="flex justify-between">
                            <strong>${res.filename}</strong>
                            <span class="text-blue-400 font-bold">Score: ${res.composite_score}</span>
                        </div>
                        <p class="text-sm text-slate-400 mt-1">${res.candidate_description}</p>
                    </div>
                `).join('');
            } catch (err) {
                alert("Error processing resumes. Check console.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Generate Rubric & Score";
            }
        };
    </script>
</body>
</html>
